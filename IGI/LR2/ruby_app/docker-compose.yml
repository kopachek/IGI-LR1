version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    networks:
      - backend_net
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=my_database
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  pg_data: