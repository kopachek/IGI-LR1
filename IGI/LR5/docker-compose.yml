services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: confectionery
      POSTGRES_USER: confectionery
      POSTGRES_PASSWORD: confectionery
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U confectionery"]
        interval: 5s
        timeout: 5s
        retries: 5

        
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn confectionery_shop.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: test
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_DB: confectionery
      POSTGRES_USER: confectionery
      POSTGRES_PASSWORD: confectionery
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    # Запускаем от того же пользователя, что и в Dockerfile
    user: "1000:1000"

volumes:
  pgdata:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local