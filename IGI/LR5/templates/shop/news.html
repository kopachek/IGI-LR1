{% extends 'base.html' %}
{% block title %}News{% endblock %}
{% block content %}
<h2>News</h2>
<ul>
{% for a in articles %}
  <li>
    <h3>{{ a.title }}</h3>
    <p>{{ a.summary }}</p>
    {% if a.image %}<img src="{{ a.image.url }}" alt="{{ a.title }}" width="200">{% endif %}
    <p>{{ a.published_at|date:"d/m/Y" }}</p>
  </li>
{% empty %}<li>No articles.</li>{% endfor %}
</ul>
{% endblock %}
