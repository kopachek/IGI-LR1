{% extends 'base.html' %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h2>Place order</h2>
<form method="post" novalidate>
  {% csrf_token %}
  <p>
    <label>Product
      <select name="product_id" required>
        {% for p in products %}<option value="{{ p.pk }}">{{ p.name }} — {{ p.price }} BYN</option>{% endfor %}
      </select>
    </label>
  </p>
  <p><label>Quantity <input type="number" name="quantity" min="1" max="100" value="1" required></label></p>
  <p><label>Delivery date <input type="date" name="delivery_date" required></label></p>
  <p><label>Pickup point
    <select name="pickup_point">
      <option value="">—</option>
      {% for pt in points %}<option value="{{ pt.pk }}">{{ pt.name }}</option>{% endfor %}
    </select>
  </label></p>
  <p><label>Promo code <input type="text" name="promo_code" maxlength="50"></label></p>
  <button type="submit">Place order</button>
</form>
{% endblock %}
